<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналитик рынка: ИИ-ассистент консультанта</title>
<meta name="description" content="ИИ-ассистент для подготовки анализа рынка в консалтинговой компании: бриф, проверка брифа, черновик отчёта, валидация, согласование с заказчиком.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%23121614'/%3E%3Crect x='7' y='15' width='3' height='6' rx='1' fill='%23fff'/%3E%3Crect x='12.5' y='11' width='3' height='10' rx='1' fill='%23fff'/%3E%3Crect x='18' y='7' width='3' height='14' rx='1' fill='%236CC79E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Ассистент анализа рынка: прототип.
   Направление: рабочий документ консультанта. Монохромная основа, волосяные линии,
   цвет только для статусов и для голоса ассистента (зелёный, как в карточке продукта).
   Каркас: слева рельс процесса (этапы 01–05 и бюджет времени ассистента), справа рабочая зона. */

:root{
  --bg:#F6F7F5;
  --surface:#FFFFFF;
  --ink:#121614;
  --ink-2:#4A524D;
  --ink-3:#8B938E;
  --line:#E3E7E4;
  --line-2:#CBD1CD;
  --assist:#1D6B4E;
  --assist-tint:#EAF3EE;
  --ok:#23804F;  --ok-tint:#E4F2EA;
  --warn:#A8670B; --warn-tint:#FBF0DD;
  --bad:#B4382A;  --bad-tint:#FAE6E2;
  --font-sans:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1211; --surface:#161A18; --ink:#E9EDEA; --ink-2:#B3BBB6; --ink-3:#7D8681;
    --line:#252B28; --line-2:#36403B;
    --assist:#6CC79E; --assist-tint:#14261E;
    --ok:#66C792; --ok-tint:#132A1E; --warn:#E5B163; --warn-tint:#2E2412; --bad:#EE8B7C; --bad-tint:#331A16;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1211; --surface:#161A18; --ink:#E9EDEA; --ink-2:#B3BBB6; --ink-3:#7D8681;
  --line:#252B28; --line-2:#36403B;
  --assist:#6CC79E; --assist-tint:#14261E;
  --ok:#66C792; --ok-tint:#132A1E; --warn:#E5B163; --warn-tint:#2E2412; --bad:#EE8B7C; --bad-tint:#331A16;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--line-2)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:26px 22px 22px;display:flex;flex-direction:column;gap:26px}
.main{padding:40px 48px 64px;min-width:0}
.main-inner{max-width:980px}
.main-inner.wide{max-width:1240px}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);gap:18px;padding:18px 16px}
  .main{padding:28px 16px 56px}
}

/* ---------- rail ---------- */
.mark{display:flex;gap:10px;align-items:center}
.mark svg{flex:none}
.mark b{display:block;font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.mark span{display:block;font-size:12px;color:var(--ink-3)}
.proj{border-top:1px solid var(--line);padding-top:16px}
.proj .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:var(--font-mono)}
.proj .v{font-weight:500;margin:4px 0 8px;line-height:1.35;overflow-wrap:anywhere}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps button{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:none;border:0;border-left:2px solid transparent;padding:9px 0 9px 12px;text-align:left;cursor:pointer;color:var(--ink-2)}
.steps button:hover:not([disabled]){color:var(--ink)}
.steps button[disabled]{cursor:not-allowed;color:var(--ink-3)}
.steps .n{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.steps .l{font-size:14px;line-height:1.3}
.steps .l small{display:block;font-size:12px;color:var(--ink-3)}
.steps .active{border-left-color:var(--ink);color:var(--ink)}
.steps .active .n{color:var(--ink)}
.steps .active .l{font-weight:600}
.steps .tick{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--ok-tint);color:var(--ok)}
.navlinks{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:12px}
.navlinks button{background:none;border:0;text-align:left;padding:7px 0 7px 14px;font-size:14px;color:var(--ink-2);cursor:pointer;border-left:2px solid transparent}
.navlinks button:hover{color:var(--ink)}
.navlinks button.active{color:var(--ink);font-weight:600;border-left-color:var(--ink)}

.budget{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}
.budget .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-family:var(--font-mono)}
.budget .clock{font-family:var(--font-mono);font-size:26px;font-weight:600;letter-spacing:-.02em;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.budget .clock small{font-size:13px;color:var(--ink-3);font-weight:400}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--assist);border-radius:2px;transition:width .4s ease}
.budget p{margin:8px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.4}
@media (max-width:980px){
  .steps{flex-direction:row;overflow-x:auto;gap:4px}
  .steps button{border-left:0;border-bottom:2px solid transparent;padding:6px 10px;grid-template-columns:auto auto;white-space:nowrap}
  .steps .active{border-bottom-color:var(--ink)}
  .steps .l small,.steps .tick{display:none}
  .navlinks{flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  .navlinks button{border-left:0;padding:4px 0}
  .budget{margin-top:0}
}

/* ---------- page header ---------- */
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.h1{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
.lead{font-size:16px;color:var(--ink-2);margin:0 0 30px;max-width:66ch}
.h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.h3{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:0 0 12px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
@media (max-width:600px){.h1{font-size:27px}}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.hr{height:1px;background:var(--line);border:0;margin:24px 0}

/* ---------- form (brief) ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sect{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:26px 28px;border-top:1px solid var(--line)}
.sect:first-child{border-top:0}
.sect-h .lt{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.sect-h h3{font-size:16px;font-weight:600;margin:2px 0 6px;letter-spacing:-.01em}
.sect-h p{margin:0;font-size:13px;color:var(--ink-3);line-height:1.45}
.fields{display:flex;flex-direction:column;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.sect{grid-template-columns:1fr;gap:14px;padding:20px 18px}.grid3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field label .req{color:var(--ink-3);font-weight:400}
.field .hint{font-size:12.5px;color:var(--ink-3)}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;transition:border-color .15s,background .15s}
input[type=text]:hover,input[type=number]:hover,textarea:hover{border-color:var(--line-2)}
input[type=text]:focus,input[type=number]:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--surface)}
textarea{min-height:72px}
.field.missing input,.field.missing textarea{border-color:var(--bad)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:7px 8px 7px 12px}
.file .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.file .sz{font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.upload{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-3);cursor:pointer}
.upload:hover{border-color:var(--ink-3)}
.upload:focus-within{border-color:var(--ink)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.upload .btn{pointer-events:none}
.actionbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.text{border-color:transparent;background:transparent;color:var(--ink-2);padding-left:8px;padding-right:8px}
.btn.text:hover{color:var(--ink);border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .arr{font-family:var(--font-mono)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.pill.ok{background:var(--ok-tint);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-tint);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-tint);color:var(--bad);border-color:transparent}
.pill.assist{background:var(--assist-tint);color:var(--assist);border-color:transparent}

/* ---------- assistant voice ---------- */
div.assist{background:var(--assist-tint);border-left:2px solid var(--assist);border-radius:0 8px 8px 0;padding:14px 18px}
.assist .who{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--assist);margin-bottom:4px}
.assist p{margin:0}
.assist p + p{margin-top:6px}

/* ---------- check table ---------- */
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;vertical-align:top;padding:11px 12px;border-bottom:1px solid var(--line)}
table.t th{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:400;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t .reveal{animation:fadein .25s ease both}
@keyframes fadein{from{opacity:.0;transform:translateY(3px)}to{opacity:1;transform:none}}
.letter{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px 18px;max-height:340px;overflow:auto}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}

/* ---------- simulation ---------- */
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:900px){.simgrid{grid-template-columns:1fr}}
.phases{list-style:none;margin:0;padding:0}
.phases > li{border-top:1px solid var(--line);padding:12px 0}
.phases > li:first-child{border-top:0}
.ph{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;color:var(--ink-3)}
.ph .ic{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2)}
.ph .nm{font-size:14.5px}
.ph .norm{font-family:var(--font-mono);font-size:12px}
li.done .ph{color:var(--ink)}
li.done .ic{background:var(--ok);border-color:var(--ok)}
li.now .ph{color:var(--ink);font-weight:600}
li.now .ic{border-color:var(--assist);border-right-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logl{list-style:none;margin:6px 0 0 34px;padding:0;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-2)}
.logl li{padding:2px 0}
.logl li.new{animation:fadein .25s ease both}
.logl li::before{content:"→ ";color:var(--assist)}
.bigclock{font-family:var(--font-mono);font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  li.now .ic{animation:none;border-right-color:var(--assist)}
  .logl li.new,table.t .reveal{animation:none}
  .bar i{transition:none}
}

/* ---------- validation ---------- */
.val{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
@media (max-width:1100px){.val{grid-template-columns:1fr}.side{position:static}}
.qc{list-style:none;margin:0;padding:0}
.qc li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.qc li:first-child{border-top:0;padding-top:0}
.qc .s{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:600}
.qc .ok .s{background:var(--ok-tint);color:var(--ok)}
.qc .warn .s{background:var(--warn-tint);color:var(--warn)}
.qc .bad .s{background:var(--bad-tint);color:var(--bad)}
.qc .lb{font-weight:500}
.qc .dt{color:var(--ink-3);font-size:12.5px}
.score{font-family:var(--font-mono);font-size:13px;color:var(--ink-3)}
.score b{font-size:22px;color:var(--ink);font-weight:600}

/* ---------- report document ---------- */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:44px 52px}
@media (max-width:700px){.doc{padding:26px 18px}}
.doc-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.doc .kicker{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.doc h2.title{font-size:28px;line-height:1.18;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.doc .sub{color:var(--ink-2);margin:0 0 26px}
.doc h3{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:34px 0 10px;display:flex;gap:12px;align-items:baseline;text-wrap:balance}
.doc h3 .sid{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);font-weight:400;min-width:24px}
.doc p,.doc li{max-width:70ch}
.doc p{margin:0 0 10px}
.doc ul{margin:0 0 10px;padding-left:20px}
.summary{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:16px 0 12px;margin-bottom:6px}
.summary ol{margin:0;padding-left:22px}
.summary li{margin:6px 0}
.ref{font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--assist);background:none;border:0;padding:0 1px;cursor:pointer}
.ref:hover{text-decoration:underline}
.ref.broken{color:var(--bad);text-decoration:line-through}
.refs{white-space:nowrap;color:var(--ink-3);font-family:var(--font-mono);font-size:11.5px}
.srcs{list-style:none;margin:0;padding:0}
.src{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:12px 8px;border-top:1px solid var(--line);border-radius:6px;transition:background .3s}
.src:first-child{border-top:0}
.src .id{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--assist)}
.src .tt{font-weight:500}
.src .mt{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.src label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.flash{background:var(--assist-tint)}
@media (max-width:600px){.src{grid-template-columns:34px minmax(0,1fr)}.src label,.src .pill{grid-column:2;justify-self:start}}
.docnote{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.changes{border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:24px;font-size:14px}
.changes ul{margin:6px 0 0;padding-left:18px}

/* ---------- report editor ---------- */
.doc.editing{border-color:var(--line-2)}
.ed.big{font-size:22px;font-weight:600;letter-spacing:-.015em}
textarea.ed{line-height:1.6}
select.ed{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
select.ed:focus{outline:none;border-color:var(--ink)}
.ed-sec{border-top:1px solid var(--line);margin-top:20px;padding-top:18px;display:flex;flex-direction:column;gap:8px}
.ed-row{display:flex;gap:10px;align-items:center}
.ed-row .sid{font-size:12px;color:var(--ink-3);min-width:26px}
.ed-row input.h{flex:1;font-weight:600}
.ed-t td{padding:6px}
.ed-t input,.ed-t select{padding:6px 8px;font-size:13px}

/* ---------- approval ---------- */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.timeline li:first-child{border-top:0}
.timeline .tm{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.timeline .ev.k-assist{color:var(--assist)}
.timeline .ev.k-ok{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.sim-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stats > div{padding:18px 20px;border-left:1px solid var(--line)}
.stats > div:first-child{border-left:0}

function fmtNum(n, d){ if(typeof n!=='number'||!isFinite(n)) return '—'; const a=Math.abs(n); const dd = d!=null ? d : a>=100?1:a>=1?2:3; return n.toLocaleString('ru-RU',{maximumFractionDigits:dd}); }
function clock(sec){ sec=Math.max(0,Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function when(ts){ try{ return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

/* ============ состояние ============ */
const FIELDS = [
  {k:'client', label:'Название компании', g:'A'},
  {k:'industry', label:'Отрасль', g:'A'},

let edit = null;      // редактирование отчёта консультантом

function log(text, kind){ S.events.push({at:Date.now(), text, kind:kind||''}); }

const lastVer = () => S.versions[S.versions.length-1] || null;

/* ============ проверка брифа (правила ассистента) ============ */
const CRITERION = /(не\s*менее|не\s*ниже|не\s*больше|порог|критери|окупаем|irr|npv|маржинальн|рентабельн|\d+\s*%|\d+[.,]?\d*\s*(млн|млрд))/i;
function checkBrief(b){
  const it = [];
  const has = k => String(b[k]||'').trim().length > 0;
  const add = (k,status,note,question,assumption) => it.push({k, label:LABEL[k], status, note, question:question||'', assumption:assumption||''});

  else if(!/@/.test(b.contact)) add('contact','clarify','Нет e-mail для отправки отчёта','Укажите, пожалуйста, e-mail для отправки отчёта на согласование.','Отчёт будет передан через менеджера проекта.');
  else add('contact','ok','Указан, есть e-mail');
  if(!has('question')) miss('question','Какое решение вы планируете принять по итогам анализа?');

  else add('analysisReqs','ok',`${n} ${plural(n,'требование','требования','требований')}, все войдут в матрицу соответствия`);
  if(!has('formatReqs')) miss('formatReqs','Есть ли требования к объёму, структуре и единицам измерения отчёта?');

  const fc = b.clientFiles.length;

function buildCompliance(b){

  });
  rows.push({requirement:'Требования к оформлению: '+(b.formatReqs||'по методике компании'), status:'выполнено', where:'весь отчёт', comment:'Структура, единицы и ссылки по требованиям. Итоговый объём консультант доводит при редактуре', format:true});
  return rows;
}

function reviseReport(rep, text, who, n){
  const r = clone(rep), items = lines(text), log = [];
  r.calculations.forEach(c=>{
    const x = recalc(c);
    if(!x.ok && x.value!=null){ const v = +x.value.toFixed(Math.abs(x.value)>=10?1:3); log.push(`Исправлен расчёт ${c.id}: ${fmtNum(c.result)} → ${fmtNum(v)} ${c.unit}`); c.result = v; }
  });
  r.sources.forEach(s=>{ if(!s.url && !s.file){ s.file = 'База знаний'; log.push(`Добавлена ссылка для источника ${s.id}`); } });
  const whoLabel = who==='client' ? 'Комментарии заказчика' : 'Правки консультанта';
  const bullets = items.map(l=>{ const w = whereFor(l); log.push(`Учтено: «${cut(l,70)}» (раздел ${w})`); return `- ${l} (см. ${w}) [И1]`; });
  if(items.length){
    let sec = r.sections.find(s=>s.id==='S8');
    if(!sec){ sec = {id:'S8', heading:'Доработки по комментариям', body:''}; r.sections.push(sec); }
    sec.body += (sec.body ? '\n\n' : '') + `**${whoLabel}, версия ${n}:**\n` + bullets.join('\n');
    if(who==='client'){
      const fmtIdx = r.compliance.findIndex(c=>c.format);
      const add = items.map(l=>({requirement:'Комментарий заказчика: '+l, status:'выполнено', where:whereFor(l)+', S8', comment:'Версия '+n}));
      r.compliance.splice(fmtIdx<0 ? r.compliance.length : fmtIdx, 0, ...add);
    }
  }
  r.changeLog = log.length ? log : ['Существенных изменений не потребовалось'];
  return r;
}

/* ============ контроль качества ============ */
const REF_RE = /\[((?:[ИР]\d+)(?:\s*[,;]\s*[ИР]\d+)*)\]/g;
function recalc(c){
  const e = String(c.expression||'').replace(/\^/g,'**');
  if(!e.trim() || !/^[\d\s.+\-*/()]+$/.test(e)) return {ok:false, value:null, reason:'нет выражения'};
  let v; try{ v = Function('"use strict";return ('+e+')')(); }catch(err){ return {ok:false, value:null, reason:'ошибка в формуле'}; }
  if(typeof v!=='number' || !isFinite(v)) return {ok:false, value:null, reason:'не число'};
  const r = Number(c.result), tol = Math.max(Math.abs(r)*0.015, 0.006);
  const ok = Math.abs(v-r) <= tol;
  return {ok, value:v, reason: ok ? '' : 'расхождение'};
}
function qc(ver){
  const r = ver.report, ids = new Set(r.sources.map(s=>s.id)), cids = new Set(r.calculations.map(c=>c.id));
  const text = r.summary.concat(r.sections.map(s=>s.body)).join('\n');
  const refs = []; text.replace(REF_RE,(m,g)=>{ g.split(/\s*[,;]\s*/).forEach(x=>refs.push(x)); return m; });
  const broken = [...new Set(refs.filter(x => x[0]==='И' ? !ids.has(x) : !cids.has(x)))];
  const noRef = r.sections.filter(s => !/\[[^\]]*И\d+/.test(s.body));
  const unlinked = r.sources.filter(s => !(s.url || s.file));
  const calcs = r.calculations.map(recalc), calcOk = calcs.filter(c=>c.ok).length;
  const reqRows = r.compliance.filter(c=>!c.format);
  const cnt = st => reqRows.filter(c=>c.status===st).length;
  const done = cnt('выполнено'), part = cnt('частично'), fail = cnt('не выполнено');
  const needV = r.sources.filter(s=>s.verify), ver_ = needV.filter(s=>ver.verified && ver.verified[s.id]).length;
  const checks = [
    {lb:'Ссылки на все источники', st: broken.length ? 'bad' : noRef.length ? 'warn' : 'ok',
      dt: broken.length ? `Ссылки без источника: ${broken.join(', ')}` : noRef.length ? `Разделы без ссылок: ${noRef.map(s=>s.id).join(', ')}` : `${refs.length} ${plural(refs.length,'ссылка','ссылки','ссылок')}, все ведут на источник или расчёт`},
    {lb:'Источники с адресом или файлом', st: unlinked.length ? 'warn' : 'ok', dt: unlinked.length ? `Без ссылки: ${unlinked.map(s=>s.id).join(', ')}` : `${r.sources.length} из ${r.sources.length}`},
    {lb:'Матрица соответствия требованиям', st: fail ? 'bad' : part ? 'warn' : 'ok', dt:`${reqRows.length} ${plural(reqRows.length,'пункт','пункта','пунктов')}: выполнено ${done}, частично ${part}, не выполнено ${fail}`},
    {lb:'Воспроизводимость расчётов', st: !calcs.length ? 'warn' : calcOk===calcs.length ? 'ok' : 'bad', dt:`Пересчитано, совпало: ${calcOk} из ${calcs.length}`},
    {lb:'Перечень ограничений анализа', st: r.limitations.length>=3 ? 'ok' : 'warn', dt:`${r.limitations.length} ${plural(r.limitations.length,'пункт','пункта','пунктов')}`},
    {lb:'Открытые источники проверены', st: ver_===needV.length ? 'ok' : 'warn', dt:`Отмечено консультантом: ${ver_} из ${needV.length}`}
  ];
  return {checks, calcs, score:checks.filter(c=>c.st==='ok').length, total:checks.length, bad:checks.filter(c=>c.st==='bad').length};
}

/* ============ имитация работы ассистента ============ */
function draftScript(){
  const b = S.brief, reqs = reqList(b), fc = b.clientFiles.length, mc = b.materials.length, sc = buildSources(b).length;
  return [
    [`Бриф: ${cut(shortClient(b.client),40)}`, 'Методика анализа: 9 этапов; методика оформления: 7 правил', `Данные заказчика: ${fc} ${plural(fc,'файл','файла','файлов')}${b.clientData.trim()?' и данные в брифе':''}`],
    [`Отраслевые отчёты в базе знаний: ${D.LIBRARY.industry.length}${mc?`, от консультанта: ${mc}`:''}`, `Отчёты компаний рынка: ${D.LIBRARY.companies.length}`, 'Открытая статистика: Росстат, ЕМИСС, ФТС', `Отобрано источников для отчёта: ${sc}`],
    ['Объём рынка 2021–2025 по отраслевому обзору [И2]', 'Сверка с данными Росстата [И3]', 'Среднегодовой темп роста [Р1]'],
    ['Структура по сырью и каналам продаж [И2]', 'Профили пяти игроков по отчётности [И4]'],
    ['Драйверы спроса и барьеры входа [И5, И6]', 'Сценарии: базовый +15% в год, консервативный +8% в год [Р2, Р3]'],
    ['Выручка заказчика при доле 3% и 5% [Р4, Р5]', 'Проверка свободной мощности розлива [Р6]'],
    ['Разделы по методике оформления: резюме, методология, анализ, выводы', `Требования заказчика: ${reqs.length}, переношу в матрицу соответствия`],
    ['Ссылки на источники в каждом разделе', 'Формулы расчётов сохранены для пересчёта', 'Перечень ограничений и допущений']
  ];
}
function reviseScript(text){
  const it = lines(text);
  return [
    [`${it.length} ${plural(it.length,'комментарий','комментария','комментариев')}`].concat(it.slice(0,2).map(l=>'«'+cut(l,60)+'»')),
    ['Изменения в разделах: '+([...new Set(it.map(whereFor))].join(', ') || '—')],
    ['Пересчёт всех формул отчёта'],
    ['Матрица соответствия обновлена']
  ];
}
function startSim(kind, phases, script, label, onDone){
  const steps = [];
  phases.forEach((p,i)=>{ const ls = script[i] && script[i].length ? script[i] : ['']; ls.forEach(l=>steps.push({i, line:l, sec:p.min*60/ls.length})); });
  sim = {kind, label, phases, steps, k:0, logs:phases.map(()=>[]), sec:0, onDone, timer:null};
  goStage(3);
  sim.timer = setInterval(simTick, 420);
}
function simTick(fast){
  if(!sim) return;
  const st = sim.steps[sim.k];
  if(!st){ finishSim(); return; }
  if(st.line) sim.logs[st.i].push(st.line);
  sim.sec += st.sec; sim.k++;
  if(!fast){ if(S.view==='stage' && S.stage===3) renderMain(); renderRail(); }
}
function finishSim(){
  const s = sim; clearInterval(s.timer); sim = null;
  s.onDone(Math.round(s.sec/60));
}
function skipSim(){ if(!sim) return; while(sim && sim.k < sim.steps.length) simTick(true); if(sim) finishSim(); }

function runCheck(){
  const items = checkBrief(S.brief);
  S.check = {items, at:Date.now(), accepted:false};
  const st = checkStats(items);
  log(`Ассистент проверил бриф: в порядке ${st.ok.length}, уточнить ${st.clarify.length}, не заполнено ${st.missing.length}`, 'assist');
  checking = {shown:0};
  goStage(2);
  const t = setInterval(()=>{
    if(!checking){ clearInterval(t); return; }
    checking.shown++;
    if(checking.shown >= items.length){ clearInterval(t); checking = null; }
    if(S.view==='stage' && S.stage===2) renderMain();
  }, 110);
}
function runDraft(){
  if(S.check) S.check.accepted = true;
  startSim('draft', D.PHASES, draftScript(), 'Подготовка черновика', min=>{
    S.versions.push({n:S.versions.length+1, at:Date.now(), by:'Ассистент', note:'Первый черновик', report:buildReport(), verified:{}, min});
    S.cur = S.versions.length-1; S.asstMin = min; S.approvedVer = null;
    log(`Ассистент подготовил черновик v${S.versions.length} за ${min} мин`, 'assist');
    goStage(4);
  });
}
function runRevise(text, who){
  const base = lastVer(); if(!base) return;
  const n = S.versions.length + 1;
  log(who==='client' ? `Получены комментарии заказчика: ${lines(text).length}` : `Консультант передал правки: ${lines(text).length}`, '');
  startSim('revise', D.REVISE_PHASES, reviseScript(text), who==='client' ? 'Доработка по комментариям заказчика' : 'Доработка по правкам консультанта', min=>{
    const rep = reviseReport(base.report, text, who, n);
    const verified = {}; rep.sources.forEach(s=>{ if(base.verified[s.id]) verified[s.id] = true; });
    S.versions.push({n, at:Date.now(), by: who==='client' ? 'Ассистент · комментарии заказчика' : 'Ассистент · правки консультанта', note:text, report:rep, verified, min});
    S.cur = S.versions.length-1; S.reviseMin += min; S.approvedVer = null;
    if(who==='client') S.client.status = 'none';
    log(`Ассистент подготовил версию v${n} за ${min} мин`, 'assist');
    goStage(4);
  });
}

  const st = checkStats(items);
  const rows = items.map((it,i)=> i<shown ? `<tr class="${checking && i===shown-1?'reveal':''}"><td>${esc(it.label)}</td><td>${statusPill(it.status)}</td><td class="muted">${esc(it.note)}</td></tr>` : `<tr><td>${esc(it.label)}</td><td><span class="faint small">проверяю…</span></td><td></td></tr>`).join('');
  const finished = !checking;
  let msg = '';
  if(finished){

    else if(st.clarify.length) msg = `<p>Бриф достаточен для старта, но ${st.clarify.length} ${plural(st.clarify.length,'пункт стоит','пункта стоит','пунктов стоит')} уточнить у заказчика. Ниже готовое письмо с вопросами. Если не уточнять, я приму допущения и укажу их в ограничениях анализа.</p>`;

      <div class="card" style="padding:8px 12px"><div class="tbl-wrap"><table class="t">

/* ---------- 04 Валидация ---------- */
function md(text, ver){
  const ids = new Set(ver.report.sources.map(s=>s.id)), cids = new Set(ver.report.calculations.map(c=>c.id));
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(REF_RE,(m,g)=>'<span class="refs">['+g.split(/\s*[,;]\s*/).map(id=>{ const ok = id[0]==='И'?ids.has(id):cids.has(id); return `<button type="button" class="ref ${ok?'':'broken'}" data-act="jump" data-id="${id}">${id}</button>`; }).join(', ')+']</span>');
  const isLi = l => /^\s*[-•]\s+/.test(l), li = l => '<li>'+inline(l.replace(/^\s*[-•]\s+/,''))+'</li>';
  return esc(text).split(/\n{2,}/).map(b=>{
    const ls = b.split('\n').filter(x=>x.trim()); if(!ls.length) return '';
    const f = ls.findIndex(isLi);
    if(f===0 && ls.every(isLi)) return '<ul>'+ls.map(li).join('')+'</ul>';
    if(f>0 && ls.slice(f).every(isLi)) return '<p>'+inline(ls.slice(0,f).join('<br>'))+'</p><ul>'+ls.slice(f).map(li).join('')+'</ul>';
    return '<p>'+inline(ls.join('<br>'))+'</p>';
  }).join('');
}
function compPill(s){ return s==='выполнено' ? '<span class="pill ok">выполнено</span>' : s==='частично' ? '<span class="pill warn">частично</span>' : '<span class="pill bad">не выполнено</span>'; }
function verStatus(v){
  if(S.client.status==='approved' && S.client.sentVer===v.n) return '<span class="pill ok">согласовано заказчиком</span>';
  if(S.client.status==='waiting' && S.client.sentVer===v.n) return '<span class="pill assist">на согласовании</span>';
  if(S.approvedVer===v.n) return '<span class="pill ok">утверждено консультантом</span>';
  if(v===lastVer()) return '<span class="pill warn">на валидации</span>';
  return '<span class="pill">архив</span>';
}
function reportHTML(v, q){
  const r = v.report;

function setEd(path, val){
  const r = edit.rep, p = path.split('.'), ls = t => t.split('\n').map(x=>x.trim()).filter(Boolean);
  if(path==='title') r.title = val;
  else if(path==='subtitle') r.subtitle = val;
  else if(path==='summary') r.summary = ls(val);
  else if(path==='limits') r.limitations = ls(val);
  else if(p[0]==='sec') r.sections[+p[1]][p[2]] = val;
  else if(p[0]==='calc') r.calculations[+p[1]][p[2]] = p[2]==='result' ? (val.trim()==='' ? NaN : Number(val.replace(/\s/g,'').replace(',','.'))) : val;
  else if(p[0]==='comp') r.compliance[+p[1]][p[2]] = val;
  else if(p[0]==='src') r.sources[+p[1]][p[2]] = val;
  const c = $('#qc-card'); if(c) c.innerHTML = qcInner(qc({report:r, verified:curVer().verified}));
}
function diffReport(a, b){
  const out = [];
  if(a.title!==b.title) out.push('Изменён заголовок отчёта');
  if(a.subtitle!==b.subtitle) out.push('Изменён подзаголовок');
  if(a.summary.join('\n')!==b.summary.join('\n')) out.push('Отредактировано резюме');
  b.sections.forEach(s=>{ const o=a.sections.find(x=>x.id===s.id); if(!o) out.push(`Добавлен раздел ${s.id} «${cut(s.heading,50)}»`); else if(o.heading!==s.heading || o.body!==s.body) out.push(`Отредактирован раздел ${s.id} «${cut(s.heading,50)}»`); });
  a.sections.forEach(o=>{ if(!b.sections.find(x=>x.id===o.id)) out.push(`Удалён раздел ${o.id} «${cut(o.heading,50)}»`); });
  b.calculations.forEach((c,i)=>{ const o=a.calculations[i]; if(!o) return;
    if(!(o.result===c.result || (isNaN(o.result)&&isNaN(c.result)))) out.push(`Расчёт ${c.id}: ${fmtNum(o.result)} → ${fmtNum(c.result)} ${c.unit}`);
    else if(o.expression!==c.expression || o.metric!==c.metric || o.unit!==c.unit) out.push(`Изменена формула или описание расчёта ${c.id}`); });
  b.compliance.forEach((c,i)=>{ const o=a.compliance[i]; if(!o) return;
    if(o.status!==c.status) out.push(`Матрица, пункт ${i+1}: «${o.status}» → «${c.status}»`);
    else if(o.comment!==c.comment || o.where!==c.where) out.push(`Матрица, пункт ${i+1}: обновлён комментарий`); });
  b.sources.forEach((s,i)=>{ const o=a.sources[i]; if(o && (o.title!==s.title || o.url!==s.url || o.file!==s.file)) out.push(`Обновлён источник ${s.id}`); });
  if(a.limitations.join('\n')!==b.limitations.join('\n')) out.push('Отредактирован перечень ограничений');
  return out;
}
function saveEdit(){
  const base = lastVer(), r = edit.rep, changes = diffReport(base.report, r);

  r.changeLog = (note ? ['Комментарий консультанта: '+note] : []).concat(changes);
  const n = S.versions.length + 1;
  S.versions.push({n, at:Date.now(), by:'Консультант · ручная правка', note, report:r, verified:clone(base.verified), min:0, manual:true});
  S.cur = S.versions.length-1; S.approvedVer = null; edit = null;
  log(`Консультант внёс правки в отчёт: версия v${n} (${changes.length} ${plural(changes.length,'изменение','изменения','изменений')})`, '');
  save(); render(); window.scrollTo(0,0); toast(`Сохранена версия v${n}`);
}

  return `<div class="main-inner">${H}<div class="stack">${body}${timelineHTML()}</div></div>`;
}

/* ---------- Карточка продукта ---------- */
function viewPassport(){
  const go = (n,t) => `<button type="button" class="btn sm" data-act="step-any" data-n="${n}">${t}</button>`;
  const gv = (v,t) => `<button type="button" class="btn sm" data-act="view" data-v="${v}">${t}</button>`;
  return `<div class="main-inner">
    ${head('Карточка продукта', 'ИИ-ассистент для анализа рынка', 'Консалтинговая компания проводит анализ рынка почти в каждом проекте. Сейчас его делает один консультант за 2–3 дня, и большая часть времени уходит на поиск данных. Ассистент готовит черновик за 1 час, консультант проверяет его и отправляет заказчику на согласование.')}
    <div class="stack">
      <div class="h3">Цепочка артефактов</div>
      <div class="chain">
        <div class="pcard"><div class="k">Артефакт на входе</div><p>Структурированный бриф: сведения о заказчике, бизнес-вопрос, границы рынка (сегмент, география, период), требования к анализу и оформлению, данные заказчика при наличии. Ассистент проверяет все пункты и сообщает, что уточнить.</p><div class="where">В системе: этапы 01 и 02 · ${go(1,'Бриф')} ${go(2,'Проверка')}</div></div>
        <div class="arrow">→</div>
        <div class="pcard"><div class="k">Артефакт на выходе</div><p>Черновик отчёта с анализом рынка, который соответствует требованиям заказчика и содержит ссылки на источники.</p><div class="where">В системе: этапы 03 и 04 · ${go(3,'Анализ')} ${go(4,'Валидация')}</div></div>
        <div class="arrow">→</div>
        <div class="pcard"><div class="k">Потребитель</div><p>Представитель компании-заказчика, с которым согласуются материалы.</p><div class="where">В системе: этап 05 · ${go(5,'Согласование')}</div></div>
      </div>
      <div class="pgrid">
        <div class="pcard"><div class="k">Знания и источники данных</div><ul class="checklist"><li>Методика проведения анализа рынка</li><li>Информация и данные о заказчике</li><li>Методика оформления отчёта</li><li>Отраслевые отчёты</li><li>Отчёты компаний рассматриваемого рынка</li></ul><div class="where">${gv('kb','База знаний')}</div></div>
        <div class="pcard"><div class="k">Атрибуты выходного артефакта</div><ul class="checklist"><li>Ссылки на все источники</li><li>Матрица соответствия отчёта пунктам требований заказчика</li><li>Воспроизводимость расчётов</li><li>Перечень ограничений анализа</li></ul><div class="where">Проверяются автоматически в панели «Контроль качества» на этапе 04</div></div>
        <div class="pcard"><div class="k">Целевое время</div><p>Работа ассистента: до 1 часа. Далее валидация консультантом и отправка заказчику на согласование, доработки по его комментариям.</p><div class="where">Таймер «Время работы ассистента» в левой колонке</div></div>
        <div class="pcard"><div class="k">Экономический эффект</div><p>Рост среднего чека проекта на 5%. Рост производительности консультанта за счёт сокращения срока анализа и отсутствия просрочек.</p><div class="where">${gv('effect','Расчёт эффекта')}</div></div>
      </div>
    </div>
  </div>`;
}

/* ---------- База знаний ---------- */
function docItem(d){ return `<li><span class="ic">${esc(d.fmt||'WEB')}</span><div><div class="tt">${esc(d.title)}</div><div class="mt">${esc(d.publisher||'')}${d.year?' · '+d.year:''}${d.use?' · используется: '+esc(d.use):''}</div>${d.url?`<div class="mt"><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.url)}</a></div>`:''}</div><span class="pill ok">в индексе</span></li>`; }
function viewKB(){
  const T = [['method-a','Методика анализа'],['method-f','Методика оформления'],['clients','Заказчики'],['industry','Отраслевые отчёты'],['companies','Отчёты компаний'],['stats','Открытая статистика']];
  const t = S.kbTab || 'method-a', b = S.brief;
  let body = '';
  if(t==='method-a' || t==='method-f'){
    const key = t==='method-a' ? 'analysis' : 'format';
    body = `<div class="card"><div class="field"><label for="m-text">${t==='method-a'?'Методика проведения анализа рынка':'Методика оформления отчёта'}</label><textarea id="m-text" data-m="${key}" rows="14">${esc(S.method[key])}</textarea><span class="hint">Ассистент применяет методику на каждом этапе. Изменения сохраняются автоматически.</span></div>
      <div class="row" style="margin-top:12px"><button type="button" class="btn text sm" data-act="mreset" data-k="${key}">Вернуть исходную</button></div></div>`;
  } else if(t==='clients'){
    body = `<div class="card"><div class="h3">Карточка заказчика текущего проекта</div>
      <h2 class="h2">${esc(b.client||'Не указан')}</h2><p class="muted" style="margin:0 0 12px">${esc(b.industry)}</p><p style="margin:0 0 12px">${esc(b.clientInfo)}</p>
      <p class="small"><span class="faint">Представитель:</span> ${esc(b.contact||'—')}</p>
      <p class="small"><span class="faint">Данные заказчика:</span> ${b.clientFiles.length} ${plural(b.clientFiles.length,'файл','файла','файлов')}${b.clientData.trim()?', данные в брифе':''}</p>
      <p class="small faint" style="margin:14px 0 0">Карточка синхронизируется с CRM компании вместе с историей прошлых проектов.</p></div>`;
  } else if(t==='industry'){
    const mats = b.materials.map(m=>({title:m.name, publisher:'Материал консультанта по текущему проекту', fmt:(m.name.split('.').pop()||'').toUpperCase().slice(0,4), use:'Загружен в бриф'}));
    body = `<ul class="doclist">${mats.concat(D.LIBRARY.industry).map(docItem).join('')}</ul>`;
  } else if(t==='companies'){
    body = `<ul class="doclist">${D.LIBRARY.companies.map(docItem).join('')}</ul>`;
  } else {
    body = `<ul class="doclist">${D.LIBRARY.stats.map(d=>docItem(Object.assign({fmt:'WEB'},d))).join('')}</ul>`;
  }
  return `<div class="main-inner">
    ${head('Знания и источники данных', 'База знаний', 'Всё, на что опирается ассистент: методики компании, сведения о заказчиках, отраслевые отчёты и отчёты компаний рынка.')}
    <div class="tabs" role="tablist">${T.map(([k,l])=>`<button type="button" role="tab" aria-selected="${t===k}" class="${t===k?'on':''}" data-act="kbtab" data-t="${k}">${l}</button>`).join('')}</div>
    ${body}
  </div>`;
}

/* ---------- Экономический эффект ---------- */
function effectOut(){
  const e = S.effect, n = +e.perMonth||0, m = +e.manualH||0, w = +e.withH||0;
  const saved = Math.max(0, n*(m-w)), money = saved*(+e.rate||0), extra = n*12*(+e.avgCheck||0)*(+e.uplift||0)/100;
  const maxH = Math.max(m, w, 1);
  return `<div class="outbig">
      <div><div class="v">${fmtNum(saved,0)} ч</div><div class="k">высвобождается времени консультантов в месяц</div></div>
      <div><div class="v">${fmtNum(saved/160,1)}</div><div class="k">эквивалент полных ставок (160 ч в месяц)</div></div>
      <div><div class="v">${fmtNum(money/1e6,2)} млн руб.</div><div class="k">стоимость высвобожденного времени в месяц</div></div>
      <div><div class="v">+${fmtNum(extra,1)} млн руб.</div><div class="k">дополнительная выручка в год от роста среднего чека на ${fmtNum(+e.uplift||0,1)}%</div></div>
    </div>
    <div style="margin-top:14px">
      <div class="h3">Часы консультанта на один анализ</div>
      <div class="compare"><span>Вручную</span><span class="track"><i style="width:${m/maxH*100}%"></i></span></div>
      <div class="compare"><span>С ассистентом</span><span class="track a"><i style="width:${w/maxH*100}%"></i></span></div>
    </div>`;
}
function viewEffect(){
  const e = S.effect;
  const inp = (k,l,step) => `<div class="inrow"><label for="e-${k}">${l}</label><input type="number" id="e-${k}" data-e="${k}" value="${esc(e[k])}" min="0" step="${step||1}"></div>`;
  return `<div class="main-inner">
    ${head('Дополнительно', 'Экономический эффект', 'Рост среднего чека проекта на 5% и рост производительности консультанта за счёт сокращения срока анализа и отсутствия просрочек. Подставьте параметры своей компании.')}
    <div class="calc">
      <div class="card"><div class="h3">Параметры</div>
        ${inp('perMonth','Проектов с анализом рынка в месяц')}
        ${inp('manualH','Часов консультанта на анализ вручную (2–3 дня)')}
        ${inp('withH','Часов консультанта с ассистентом (валидация и доработки)',0.5)}
        ${inp('rate','Стоимость часа консультанта, руб.',100)}
        ${inp('avgCheck','Средний чек проекта, млн руб.',0.1)}
        ${inp('uplift','Рост среднего чека, %',0.5)}
      </div>
      <div class="card"><div class="h3">Результат</div><div id="effect-out">${effectOut()}</div></div>
    </div>
    <div class="assist" style="margin-top:18px"><div class="who">Сроки</div><p>Срок подготовки анализа фиксирован: до 1 часа работы ассистента плюс валидация. Поэтому анализ перестаёт быть узким местом проекта, а просрочки по нему исключаются.</p></div>
  </div>`;
}

/* ============ выгрузка отчёта ============ */
function reportFileHTML(v){
  const r = v.report;
  const txt = t => esc(t).split(/\n{2,}/).map(b=>{ const ls=b.split('\n'); const f=ls.findIndex(l=>/^\s*[-•]\s+/.test(l)); const li=l=>'<li>'+l.replace(/^\s*[-•]\s+/,'')+'</li>';
    if(f===0) return '<ul>'+ls.map(li).join('')+'</ul>'; if(f>0) return '<p>'+ls.slice(0,f).join('<br>')+'</p><ul>'+ls.slice(f).map(li).join('')+'</ul>'; return '<p>'+ls.join('<br>')+'</p>'; }).join('').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return `<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>${esc(r.title)}</title><style>body{font-family:Arial,Helvetica,sans-serif;max-width:860px;margin:40px auto;padding:0 24px;line-height:1.55;color:#111}h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:30px 0 8px}.sub{color:#555}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}th{color:#666;font-weight:normal;font-size:12px;text-transform:uppercase}.sum{border-top:2px solid #111;padding-top:8px}</style></head><body>
<p class="sub">Черновик отчёта · версия ${v.n} · ${when(v.at)}</p><h1>${esc(r.title)}</h1><p class="sub">${esc(r.subtitle)} · заказчик: ${esc(S.brief.client)}</p>
<div class="sum"><h2>Резюме</h2><ol>${r.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
${r.sections.map(s=>`<h2>${esc(s.heading)}</h2>${txt(s.body)}`).join('')}
<h2>Расчёты</h2><table><tr><th>№</th><th>Показатель</th><th>Формула</th><th>Выражение</th><th>Результат</th><th>Источник</th></tr>${r.calculations.map(c=>`<tr><td>${c.id}</td><td>${esc(c.metric)}</td><td>${esc(c.formula)}</td><td><code>${esc(c.expression)}</code></td><td>${fmtNum(c.result)} ${esc(c.unit)}</td><td>${esc(c.sources.join(', '))}</td></tr>`).join('')}</table>
<h2>Матрица соответствия требованиям</h2><table><tr><th>№</th><th>Требование</th><th>Статус</th><th>Где в отчёте</th><th>Комментарий</th></tr>${r.compliance.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.requirement)}</td><td>${esc(c.status)}</td><td>${esc(c.where)}</td><td>${esc(c.comment)}</td></tr>`).join('')}</table>
<h2>Источники</h2><ol style="list-style:none;padding:0">${r.sources.map(s=>`<li>[${s.id}] ${esc(s.title)}, ${esc(s.publisher)}. ${s.url?`<a href="${esc(s.url)}">${esc(s.url)}</a>`:'Файл: '+esc(s.file)}</li>`).join('')}</ol>
<h2>Ограничения анализа</h2><ul>${r.limitations.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
</body></html>`;
}
function download(){
  const v = (S.client.status==='approved' && S.versions[S.client.sentVer-1]) || curVer() || lastVer(); if(!v) return;
  try{
    const blob = new Blob([reportFileHTML(v)], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Анализ рынка ${shortClient(S.brief.client).replace(/[«»"\\/:*?<>|]/g,'')} v${v.n}.html`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Отчёт выгружен в .html');
  }catch(e){ toast('Не удалось скачать файл в этом окне'); }
}

/* ============ модальное окно ============ */
function modal(html){ $('#modal-box').innerHTML = html; $('#modal').classList.add('open'); const b=$('#modal-box button'); if(b) b.focus(); }
function closeModal(){ $('#modal').classList.remove('open'); }

/* ============ действия ============ */
const ACT = {
  step: el => { const n=+el.dataset.n; if(n<=S.maxStage) goStage(n); },
  'step-any': el => { const n=+el.dataset.n; goStage(Math.min(n, S.maxStage)); if(n>S.maxStage) toast('Этот этап откроется по ходу проекта'); },
  view: el => goView(el.dataset.v),
  kbtab: el => { S.kbTab = el.dataset.t; save(); renderMain(); },
  example: () => { S.brief = clone(D.EXAMPLE); S.check=null; save(); render(); toast('Бриф заполнен примером'); },
  clear: () => { S.brief = blankBrief(); S.check=null; save(); render(); },
  check: () => runCheck(),
  draft: () => runDraft(),
  skip: () => skipSim(),
  'send-q': async () => { const t = questionsLetter(S.check.items); log('Вопросы по брифу подготовлены для заказчика'); save(); renderRail(); try{ await navigator.clipboard.writeText(t); toast('Письмо скопировано'); }catch(e){ toast('Скопируйте текст письма вручную'); } },
  rmfile: el => { S.brief[el.dataset.key].splice(+el.dataset.i,1); save(); renderMain(); },
  jump: el => { const id=el.dataset.id, t=document.getElementById((id[0]==='И'?'src-':'calc-')+id); if(t){ t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1500); } },
  openver: el => { S.cur=+el.dataset.i; save(); renderMain(); },
  'cons-example': () => { $('#cons-text').value = 'Исправить расхождение в расчёте натурального объёма рынка\nВ выводах добавить сроки выхода на полку'; },
  'cons-revise': () => { const t=$('#cons-text').value.trim(); if(!t){ toast('Опишите правки'); return; } runRevise(t,'consultant'); },
  'ed-start': () => { edit = {rep: clone(lastVer().report)}; edit.rep.changeLog = []; renderMain(); renderRail(); },
  'ed-cancel': () => { edit = null; renderMain(); },
  'ed-save': () => saveEdit(),
  'ed-addsec': () => { const nums = edit.rep.sections.map(s=>+String(s.id).replace(/\D/g,'')||0); const id = 'S'+(Math.max(0,...nums)+1); edit.rep.sections.push({id, heading:'Новый раздел', body:''}); renderMain(); const t=document.querySelector(`[data-ed="sec.${edit.rep.sections.length-1}.heading"]`); if(t){ t.focus(); t.select(); } },
  'ed-delsec': el => { edit.rep.sections.splice(+el.dataset.i,1); renderMain(); },
  approve: () => { const v=lastVer(); S.approvedVer=v.n; S.client.status = S.client.status==='approved' ? 'approved' : 'ready'; log(`Консультант утвердил версию v${v.n}`, 'ok'); goStage(5); },
  send: () => { const v=lastVer(); S.client = {status:'waiting', sentVer:v.n, sentAt:Date.now(), mode:'comments'}; log(`Отчёт v${v.n} отправлен на согласование: ${String($('#m-to').value).split(',')[0]}`, ''); save(); render(); toast('Отправлено на согласование'); },
  cmode: el => { S.client.mode = el.dataset.m; save(); renderMain(); },
  'client-example': () => { $('#client-text').value = 'Добавьте сравнение полочных цен с обычным молоком\nУточните, кто из пяти игроков использует контрактное производство\nВ выводах укажите сроки выхода на полку'; },
  'client-revise': () => { const t=$('#client-text').value.trim(); if(!t){ toast('Введите комментарии заказчика'); return; } S.rounds++; runRevise(t,'client'); },
  'client-approve': () => { S.client.status='approved'; log(`Заказчик согласовал отчёт v${S.client.sentVer}`, 'ok'); save(); render(); },
  openfinal: () => { S.cur = S.client.sentVer-1; goStage(4); },
  dl: () => download(),
  print: () => { try{ window.print(); }catch(e){ toast('Печать недоступна в этом окне'); } },
  mreset: el => { const k=el.dataset.k; S.method[k] = k==='analysis' ? D.METHOD_ANALYSIS : D.METHOD_FORMAT; save(); renderMain(); toast('Методика восстановлена'); },
  new: () => modal(`<h2 class="h2">Начать новый проект?</h2><p class="muted">Бриф, версии отчёта и история текущего проекта будут удалены из этого браузера. Методики сохранятся.</p><div class="actionbar"><button type="button" class="btn primary" data-act="newok" data-ex="1">С примером брифа</button><button type="button" class="btn" data-act="newok" data-ex="0">Пустой бриф</button><span class="spacer"></span><button type="button" class="btn text" data-act="close">Отмена</button></div>`),
  newok: el => { if(sim){ clearInterval(sim.timer); sim=null; } checking=null; const m=S.method, e=S.effect; S=fresh(el.dataset.ex==='1'); S.method=m; S.effect=e; save(); closeModal(); render(); },
  close: () => closeModal()
};

document.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if(!a || a.disabled) return;
  const f = ACT[a.dataset.act]; if(f){ e.preventDefault(); f(a); }
});
document.addEventListener('input', e=>{
  const t = e.target, d = t.dataset || {};
  if(d.f){ S.brief[d.f] = t.value; const fl=t.closest('.field'); if(fl) fl.classList.remove('missing'); if(d.f==='analysisReqs'){ const c=$('#req-count'); if(c) c.textContent=reqList(S.brief).length; } if(d.f==='client') renderRail(); save(); }
  else if(d.ed && edit){ setEd(d.ed, t.value); }
  else if(d.m){ S.method[d.m] = t.value; save(); }
  else if(d.e){ S.effect[d.e] = t.value; save(); const o=$('#effect-out'); if(o) o.innerHTML = effectOut(); }
});
document.addEventListener('change', e=>{
  const t = e.target, d = t.dataset || {};
  if(d.ed && edit && t.tagName==='SELECT'){ setEd(d.ed, t.value); }
  if(d.verify){ const v=curVer(); if(v){ v.verified[d.verify]=t.checked; save(); const c=$('#qc-card'); if(c) c.innerHTML = qcInner(qc(v)); } }
  if(d.files){ const key=d.files; [...t.files].forEach(f=>S.brief[key].push({name:f.name, size:f.size})); save(); renderMain(); if(t.files.length) toast(`Добавлено: ${t.files.length} ${plural(t.files.length,'файл','файла','файлов')}`); }
});
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ============ запуск ============ */
try{
  S = load();
  if(!S || S.v!==2) S = fresh(true);
  if(S.stage===3) S.stage = S.versions.length ? 4 : (S.check ? 2 : 1);
  render();
}catch(err){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  S = fresh(true); render();
}
})();

</script>
</body>
</html>
